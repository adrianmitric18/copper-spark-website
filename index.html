    <!--
      Le canonical est posé en deux temps :
      1. Synchroniquement par le script ci-dessous, AVANT que React démarre.
         Cela garantit que Googlebot voit le bon canonical pour chaque route
         dès le premier snapshot du HTML, même avant l'hydratation React.
      2. Mis à jour dynamiquement par <SEO /> (src/components/SEO.tsx) lors
         des navigations client-side dans la SPA.

      Bug fixé le 2026-05-01 : avant ce script, Googlebot recevait le même
      HTML brut pour toutes les routes (CSR pure) sans canonical, et
      consolidait tout sur la home dans Search Console.
    -->
    <link rel="canonical" id="ce-canonical" href="https://cuivre-electrique.com/" />
    <script>
      (function () {
        try {
          var path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
          // Routes admin = noindex donc on ne pose pas de canonical pour elles
          if (path.indexOf("/admin") === 0) return;
          var canonical = "https://cuivre-electrique.com" + (path === "/" ? "/" : path);
          var link = document.getElementById("ce-canonical");
          if (link) link.setAttribute("href", canonical);
          // Aligne aussi og:url pour les bots sociaux
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute("content", canonical);
        } catch (e) {
          /* fail silently — fallback canonical = home déjà posé */
        }
      })();
    </script>

    <!--
      PWA installable UNIQUEMENT sur /admin (back-office Adrian).
      Le manifest et les meta "web-app-capable" ne sont injectés
      qu'à l'exécution si l'URL commence par /admin. Sur les pages
      publiques, rien n'est injecté : le navigateur n'affiche pas
      le prompt natif "Installer cette app" aux visiteurs.
    -->
    <script>
      (function () {
        var isAdmin = window.location.pathname.indexOf('/admin') === 0;
        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon && isAdmin) {
          appleIcon.setAttribute('href', '/apple-touch-icon-admin.png');
        }
        if (!isAdmin) return;

        var head = document.head;
        var manifestLink = document.createElement('link');
        manifestLink.id = 'pwa-manifest';
        manifestLink.rel = 'manifest';
        manifestLink.href = '/admin-manifest.webmanifest';
        head.appendChild(manifestLink);

        var pwaMetas = [
          ['apple-mobile-web-app-capable', 'yes'],
          ['mobile-web-app-capable', 'yes'],
          ['apple-mobile-web-app-status-bar-style', 'default'],
          ['apple-mobile-web-app-title', 'CE Admin']
        ];
        pwaMetas.forEach(function (pair) {
          var m = document.createElement('meta');
          m.setAttribute('name', pair[0]);
          m.setAttribute('content', pair[1]);
          head.appendChild(m);
        });
      })();
    </script>
