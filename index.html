    <!--
      Le canonical, le title et la meta description sont injectés par route via le

    <!--
      PWA installable UNIQUEMENT sur /admin (back-office Adrian).
      Le manifest et les meta "web-app-capable" ne sont injectés
      qu'à l'exécution si l'URL commence par /admin. Sur les pages
      publiques, rien n'est injecté : le navigateur n'affiche pas
      le prompt natif "Installer cette app" aux visiteurs.
    -->
    <script>
      (function () {
        var isAdmin = window.location.pathname.indexOf('/admin') === 0;
        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon && isAdmin) {
          appleIcon.setAttribute('href', '/apple-touch-icon-admin.png');
        }
        if (!isAdmin) return;

        var head = document.head;
        var manifestLink = document.createElement('link');
        manifestLink.id = 'pwa-manifest';
        manifestLink.rel = 'manifest';
        manifestLink.href = '/admin-manifest.webmanifest';
        head.appendChild(manifestLink);

        var pwaMetas = [
          ['apple-mobile-web-app-capable', 'yes'],
          ['mobile-web-app-capable', 'yes'],
          ['apple-mobile-web-app-status-bar-style', 'default'],
          ['apple-mobile-web-app-title', 'CE Admin']
        ];
        pwaMetas.forEach(function (pair) {
          var m = document.createElement('meta');
          m.setAttribute('name', pair[0]);
          m.setAttribute('content', pair[1]);
          head.appendChild(m);
        });
      })();
    </script>
